# Cache policy resolved once per request so every response keeps a single,
# consistent Cache-Control header.
map $uri $ticlat_cache_control {
    # HTML must stay fresh so deploys are picked up immediately.
    default                                            "no-cache";
    # Astro emits content-hashed filenames under /_astro, safe to cache forever.
    ~^/_astro/                                         "public, max-age=31536000, immutable";
    ~*\.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$  "public, max-age=2592000";
}

# nginx's bundled mime.types has no entry for .webmanifest.
types {
    application/manifest+json  webmanifest;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Dokploy / Traefik terminates TLS upstream; keep this server plain HTTP.
    server_tokens off;

    # nginx drops inherited add_header directives as soon as an inner block
    # declares its own, so every header lives here and no location adds more.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $ticlat_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Container health probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }
}
